name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paginas
  cancel-in-progress: true

jobs:
  construir:
    name: Probar y construir
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar las pruebas
        run: npm test

      - name: Construir el sitio
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la carpeta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar el sitio
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: publicacion
        uses: actions/deploy-pages@v4
